<meta name="description" content="ORBIQ: juego de arena gratis en el navegador. Recoge orbes, esquiva círculos, encadena combos y desafía el modo Hardcore.">
<style>html,body{margin:0;height:100%;background:#07080d;overflow:hidden}canvas{position:absolute;cursor:none;display:block}</style>
</head><body><canvas id="c"></canvas>
<script>
(()=>{'use strict';
/* ===== CONSTANTES (ajusta el balance aquí) ===== */
const W=960,H=600,DT=1/60;               // resolución lógica y paso fijo (60 FPS lógicos)
const ORB_LIFE=6, ORB_MIN=5, ORB_MAX=50; // vida del orbe (s) y rango de valor
const WAVE_GAP=[20,30], WAVE_DUR=[8,15], TELEGRAPH=2, INVULN=1.5, COMBO_TIME=7;
const PU={shield:{n:'Escudo',c:'#ffd166',d:4},magnet:{n:'Imán',c:'#2de2e6',d:6},slow:{n:'Tiempo lento',c:'#a07bff',d:4},freeze:{n:'Congelar',c:'#ffffff',d:2},bomb:{n:'Detonador',c:'#ff8a3d',d:0},combo:{n:'Combo x2',c:'#ff5ea8',d:5}};
const PUK=Object.keys(PU);
/* Solo 2 modos con el mismo sistema de puntos (val:1). Hardcore (flag hc): 1 vida y oleadas más frecuentes (wave:.65) */
const MODS=[
 {n:'Normal',d:'3 vidas · dificultad progresiva',wave:1,cnt:1,val:1,life:1,hp:3,spd:1,cmb:1},
 {n:'Hardcore',d:'1 vida · oleadas más frecuentes',wave:.65,cnt:1,val:1,life:1,hp:1,spd:1,cmb:1,hc:true},
 {n:'Oleada infinita',d:'Sobrevive el máximo tiempo posible',wave:1,cnt:1.4,val:1,life:1,hp:1,spd:1.1,cmb:1,endless:true}
];
const ACH=[
 {id:'w5',n:'Sobrevive 5 oleadas',ic:'🌊',d:'Llega a la oleada 5 en Normal o Hardcore.'},
 {id:'c8',n:'Alcanza combo x8',ic:'🔥',d:'Encadena orbes hasta combo x8 (racha perfecta).'},
 {id:'c15',n:'Alcanza combo x15',ic:'💥',d:'Encadena orbes hasta combo x15 (requiere power-up Combo x2).'},
 {id:'o100',n:'Recoge 100 orbes en una partida',ic:'💎',d:'Recoge 100 orbes sin morir.'},
 {id:'boss1',n:'Derrota a un jefe',ic:'👑',d:'Derrota al jefe del nivel 10.'},
 {id:'hc1000',n:'Hardcore: más de 1000 puntos',ic:'💀',d:'Termina una partida Hardcore con más de 1000 puntos.'}
];
const SKINS=[
 {id:'default',n:'Clásico',req:null,d:'El cursor de siempre.'},
 {id:'star',n:'Estrella',req:'c15',d:'Desbloqueado con combo x15.'},
 {id:'ring',n:'Anillo doble',req:'o100',d:'Desbloqueado con 100 orbes en una partida.'},
 {id:'diamond',n:'Rombo',req:'w5',d:'Desbloqueado con 5 oleadas.'}
];
/* --- Constantes de menú y récords (nuevo) --- */
const NAME_MAX=12, SCORES_MAX=10;                        // longitud máxima del nombre y tamaño de la tabla
const MODE_C={normal:'#7dffb2',hardcore:'#ff3d5a',endless:'#2de2e6'};      // color de la etiqueta de cada modo
const LVMSG={2:'¡Oleadas más frecuentes!',3:'¡Patrones combinados!',5:'¡Mini-oleadas!',7:'¡Círculos rebotadores!'};

/* ===== UTILIDADES ===== */
const rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1)),pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b,c,d)=>Math.hypot(a-c,b-d);
const store={get(k,d){try{const v=localStorage.getItem('av_'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},
 set(k,v){try{localStorage.setItem('av_'+k,JSON.stringify(v));return true}catch(e){return false}}};

/* ===== AUDIO (Web Audio, osciladores) ===== */
let ac=null,muted=false;
function initAudio(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume()}
function tone(f,d=.12,type='sine',v=.08,slide=0){
 if(!ac||muted)return;const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
 o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
 g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d)}
const seq=(fs,gap,type,v)=>fs.forEach((f,i)=>setTimeout(()=>tone(f,.15,type,v),i*gap));
const sfx={collect:m=>tone(520+m*90,.12,'triangle',.09),miss:()=>tone(200,.2,'sawtooth',.06,-100),
 power:()=>seq([660,990],90,'square',.06),hit:()=>tone(120,.3,'sawtooth',.12,-60),level:()=>seq([523,659,784,1047],90,'triangle',.08),
 die:()=>tone(300,.9,'sawtooth',.12,-260),alarm:p=>tone(300+p*500,.12,'square',.05),boom:()=>tone(160,.4,'sawtooth',.12,-120),
 nav:()=>tone(420,.06,'triangle',.05)}; // nav: sonido suave al moverse por el menú
const ARP=[220,261.6,329.6,392,329.6,261.6]; // arpegio de fondo

/* ===== ESTADO ===== */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const mouse={x:W/2,y:H/2};
let scene='menu',G=null,K=1,parts=[],texts=[],trail=[];   // escenas: menu, playmenu, howto, records, achievements, skins, play, revive, name, over
let rec=store.get('rec',0),bestCombo=store.get('bc',1),ach=store.get('ach',{});
// Migración de ids de logros antiguos a los nuevos
const ACH_MIG={'w3':'w5','c5':'c8','c10':'c15','o50':'o100','hc500':'hc1000'};
let achChanged=false;
Object.keys(ACH_MIG).forEach(oldId=>{
 if(ach[oldId]){ach[ACH_MIG[oldId]]=1;delete ach[oldId];achChanged=true}
});
if(achChanged)store.set('ach',ach);
let recHC=store.get('rec_hardcore',0);                    // récord separado del modo Hardcore
let recHCTime=store.get('rec_hc_time',0);                 // mejor tiempo sobrevivido en Hardcore (s)
let unlockedEndless=store.get('endless',0)?true:false;    // modo Oleada infinita desbloqueado (nivel 10 en Normal)
let recEndless=store.get('rec_endless',0);                // récord de tiempo en Oleada infinita (s)
let unlockedSkins=store.get('skins',['default']);         // ids de skins desbloqueadas
let selSkin=store.get('skin','default');                  // skin elegida
if(!Array.isArray(unlockedSkins)||!unlockedSkins.includes('default'))unlockedSkins=['default'];
SKINS.forEach(s=>{if(s.req&&ach[s.req]&&!unlockedSkins.includes(s.id))unlockedSkins.push(s.id)});   // logros ya obtenidos antes
if(!unlockedSkins.includes(selSkin))selSkin='default';

/* ===== ESTADO DE MENÚ Y RÉCORDS (nuevo) ===== */
let eggMode=false,eggBuf='';            // easter egg: escribir 'egg' cambia los círculos por huevos de Pascua
let sel=0,sceneT=0;                   // opción seleccionada y segundos en la escena actual
const nm={text:''};                    // texto del input de nombre
let hl=null;                           // entrada recién agregada a resaltar: {e:entrada, t:segundos restantes}
// ¿Funciona localStorage? (en modo privado puede fallar). Si no, el juego sigue y avisamos en pantalla.
let storeOK=(()=>{try{const k='av__test';localStorage.setItem(k,'1');localStorage.removeItem(k);return true}catch(e){return false}})();
const byScore=(a,b)=>b.score-a.score||(a.date||0)-(b.date||0);   // mayor puntuación primero; empate: la más antigua
// Carga las dos tablas independientes ('av_scores_normal' y 'av_scores_hardcore').
// Migración: si existe el antiguo 'av_scores' (mezclado), reparte sus entradas por modo, guarda y lo elimina.
function loadScores(){
 const ok=e=>e&&typeof e.name==='string'&&typeof e.score==='number';
 const list=k=>{const a=store.get(k,[]);return Array.isArray(a)?a.filter(ok):[]};
 let n=list('scores_normal'),h=list('scores_hardcore');
 const old=store.get('scores',null);
 if(Array.isArray(old))old.filter(ok).forEach(e=>{if(e.mode==='hardcore')h.push(e);else if(e.mode==='normal')n.push(e)});
 const top=(a,m)=>a.filter(e=>e.mode===m).sort(byScore).slice(0,SCORES_MAX);
 n=top(n,'normal');h=top(h,'hardcore');
 if(Array.isArray(old)){const x=store.set('scores_normal',n),y=store.set('scores_hardcore',h);
  if(x&&y){try{localStorage.removeItem('av_scores')}catch(e){}}}
 return [n,h]}
let [scoresNormal,scoresHardcore]=loadScores();   // tablas en memoria (siguen funcionando aunque localStorage falle)
// Agrega la entrada a la tabla de su modo, ordena, recorta al top 10 y guarda solo esa tabla.
// Devuelve la entrada si quedó dentro del top 10, o null si no entró.
function addScore(e){const hc=e.mode==='hardcore',t=(hc?scoresHardcore:scoresNormal).concat(e).sort(byScore).slice(0,SCORES_MAX);
 if(hc)scoresHardcore=t;else scoresNormal=t;
 if(!store.set(hc?'scores_hardcore':'scores_normal',t))storeOK=false;return t.includes(e)?e:null}
const curRec=()=>G&&G.hc?recHC:rec;    // récord del modo de la partida actual
function fdate(ms){const d=new Date(ms);if(isNaN(d))return '--/--/--';const p=n=>String(n).padStart(2,'0');
 return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+p(d.getFullYear()%100)}   // fecha corta dd/mm/aa
function go(s){scene=s;sel=0;sceneT=0}      // cambia de escena y reinicia el estado de menú
function fmtTime(s){s=Math.max(0,s);return Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0')}   // mm:ss
const live=()=>G&&(scene==='play'||scene==='name'||scene==='over'||scene==='revive');   // ¿se dibuja la partida (mundo + HUD)?
const dust=Array.from({length:50},()=>({x:rnd(0,W),y:rnd(0,H),vx:rnd(-6,6),vy:rnd(-6,6)}));

function newGame(modo='normal'){
 // Normal: modificador 'Normal' · Hardcore: fuerza el modificador Hardcore
 const hc=modo==='hardcore',endless=modo==='endless',
  mod=hc?MODS.find(m=>m.hc):endless?MODS.find(m=>m.endless):MODS.find(m=>m.n==='Normal');parts=[];texts=[];hl=null;eggMode=false;
 G={t:0,score:0,lives:mod.hp,lvl:1,energy:0,streak:0,combo:1,comboT:0,orbs:[],circles:[],mod,inv:0,shake:0,
  pu:null,armed:false,puOrb:null,orbT:.5,puT:rnd(10,16),
  phase:endless?'wave':'calm',waveT:endless?9999:rnd(12,18),total:endless?9999:0,spawned:0,dur:endless?9999:10,theme:['line'],
  waves:0,miniT:10,got:0,maxCombo:1,banner:{t:3.5,a:'Modificador: '+mod.n,b:mod.d},flash:0,mt:0,mstep:0,newAch:[],alarmT:0,
  hc,mode:modo,
  perfectStreak:0,                 // Bloque A: orbes seguidos sin fallar ni recibir daño
  runT:0,                          // Bloque D: tiempo de la partida (s)
  reviveUsed:false,pendingRevive:false,   // Bloque E: crédito de revivir
  safeZone:null,safeT:rnd(25,35),  // Bloque G: zona segura
  boss:null,bossSpawned:{},        // Bloque K: jefe cada 10 niveles
  endless,endT:0,endWaveT:20,endSpawnT:0,endlessUnlockedNow:false};   // Bloque C: Oleada infinita
 if(endless)chooseTheme();
 go('play');
}
const need=()=>100+G.lvl*100;   // nivel 2→300, nivel 5→600, nivel 10→1100
function burst(x,y,c,n,sp=160,life=.6){for(let i=0;i<n;i++){const a=rnd(0,6.283),s=rnd(.2,1)*sp;
 parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:rnd(.3,1)*life,m:life,c,s:rnd(1.5,3.5)})}}
const ft=(x,y,s,c,sz=16)=>texts.push({x,y,s,c,sz,l:1});
function unlock(id){if(ach[id])return;ach[id]=1;store.set('ach',ach);G.newAch.push(ACH.find(a=>a.id===id).n);
 SKINS.forEach(s=>{if(s.req===id&&!unlockedSkins.includes(s.id)){unlockedSkins.push(s.id);store.set('skins',unlockedSkins)}})}

/* ===== SPAWN: orbes, power-ups y círculos ===== */
function spawnOrb(){
 for(let i=0;i<10;i++){const x=rnd(50,W-50),y=rnd(90,H-50);
  if(G.orbs.every(o=>dist(o.x,o.y,x,y)>70)){const golden=Math.random()<0.05;   // 5% dorados: 3x valor, mitad de vida
   G.orbs.push({x,y,age:0,life:ORB_LIFE*G.mod.life*Math.max(.4,1-.05*(G.lvl-1))*(golden?0.5:1),ph:rnd(0,6),golden});return}}}   // la vida del orbe se acorta con el nivel (tope 40%: 2.4 s)
const orbVal=o=>{const base=Math.round((ORB_MAX-(ORB_MAX-ORB_MIN)*clamp(o.age/o.life,0,1))*(1+.1*(G.lvl-1))*G.mod.val);return Math.round(base*(o.golden?3:1))};
function spawnPU(){G.puOrb={x:rnd(80,W-80),y:rnd(110,H-80),k:pick(PUK),age:0,life:8}}
// Fairness: nunca aparece a <80px del cursor (los círculos nacen fuera de pantalla)
function spawnCircle(type){
 const r=rnd(14,30),e=ri(0,3);let x,y;
 if(e===0){x=rnd(0,W);y=-r-4}else if(e===1){x=W+r+4;y=rnd(0,H)}else if(e===2){x=rnd(0,W);y=H+r+4}else{x=-r-4;y=rnd(0,H)}
 if(dist(x,y,mouse.x,mouse.y)<80+r)return false;
 const a=Math.atan2(rnd(120,H-120)-y,rnd(160,W-160)-x),sp=rnd(70,140)*(1+.08*(G.lvl-1))*G.mod.spd,sg=Math.random()<.5?-1:1;   // velocidad de círculos: +8% por nivel
 const turn=type==='curve'?rnd(.4,.9)*sg:type==='spiral'?rnd(1.4,2.2)*sg:0;
 const color=type==='curve'?'#ff8a3d':type==='spiral'?'#a07bff':type==='bounce'?'#ffd166':'#ff3d5a';   // color según patrón
 G.circles.push({x,y,r,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,type,turn,age:0,rot:0,tr:[],bounce:type==='bounce',color});
 return true}
function waveCount(){return Math.round(clamp(8+(G.lvl-1)*2.2,8,30)*G.mod.cnt)}
function chooseTheme(){ // patrones procedurales según nivel
 const t=['line','curve'];if(G.lvl>=3)t.push('spiral');if(G.lvl>=7)t.push('bounce');
 G.theme=G.lvl>=3?[pick(t),pick(t)]:[pick(t)]}

/* ===== SUBIDA DE NIVEL, DAÑO, RECOLECCIÓN ===== */
function levelUp(){
 G.energy-=need();G.lvl++;G.banner={t:3,a:'NIVEL '+G.lvl,b:LVMSG[G.lvl]||'¡Más rápido y más intenso!'};
 if(G.lvl%10===0&&!G.bossSpawned[G.lvl]){   // Bloque K: jefe en los niveles 10, 20, 30...
  G.bossSpawned[G.lvl]=true;
  G.boss={x:W/2,y:-80,r:60,hp:5,phase:1,t:0,shootT:2,vx:0,vy:0,entering:true};
  G.banner={t:3,a:'¡JEFE!',b:'Nivel '+G.lvl+' · 5 impactos'}}
 sfx.level();burst(mouse.x,mouse.y,'#7dffb2',40,260,1);spawnPU()}
function collectOrb(o){
 const v=orbVal(o),prev=G.combo;G.streak++;G.perfectStreak++;
 // Bloque A: el techo del combo sube con la racha perfecta (5 → x6, 9 → x8, 15 → x10)
 let cap=G.perfectStreak>=15?10:G.perfectStreak>=9?8:G.perfectStreak>=5?6:5;
 G.combo=Math.min(cap,1+Math.floor(G.streak/3));G.comboT=COMBO_TIME*G.mod.cmb;
 // Bloque B: con "Combo x2" activo cada orbe suma +1 al combo (tope 15)
 if(G.pu&&G.pu.k==='combo')G.combo=Math.min(15,Math.max(G.combo,prev+1));
 G.maxCombo=Math.max(G.maxCombo,G.combo);
 const pts=v*G.combo;G.score+=pts;G.energy+=v;G.got++;
 ft(o.x,o.y-10,'+'+pts,orbColor(o),18);burst(o.x,o.y,orbColor(o),14);sfx.collect(G.combo);
 if(o.golden)sfx.power();
 if(G.combo>=8)unlock('c8');if(G.combo>=15)unlock('c15');if(G.got>=100)unlock('o100');
 G.orbs.splice(G.orbs.indexOf(o),1);if(!G.endless)while(G.energy>=need())levelUp()}
function activate(k){
 const p=PU[k];ft(mouse.x,mouse.y-24,p.n,p.c,20);burst(mouse.x,mouse.y,p.c,24,200);sfx.power();
 if(k==='bomb')G.armed=true;else G.pu={k,t:p.d,m:p.d}}
function detonate(){ // Detonador: destruye todos los círculos y da puntos
 G.circles.forEach(c=>{const p=25*G.combo;G.score+=p;ft(c.x,c.y,'+'+p,'#ff8a3d');burst(c.x,c.y,'#ff8a3d',16,220)});
 G.circles=[];G.armed=false;G.shake=5;sfx.boom()}
function hurt(){
 G.lives--;G.inv=INVULN;G.streak=0;G.combo=1;G.perfectStreak=0;G.shake=5;sfx.hit();burst(mouse.x,mouse.y,'#ff3d5a',30,240);
 if(G.lives<=0){
  if(G.hc||G.reviveUsed)gameOver();   // Hardcore: sin revivir
  else{G.pendingRevive=true;go('revive')}}}   // Bloque E: ofrece revivir una vez
function gameOver(){
 burst(mouse.x,mouse.y,'#e8ecff',90,320,1.4);sfx.die();G.banner.t=0;   // oculta el cartel inicial si se muere muy pronto
 // Récord separado por modo: 'av_rec' (normal) y 'av_rec_hardcore'
 if(G.endless){if(G.endT>recEndless){recEndless=Math.floor(G.endT);store.set('rec_endless',recEndless)}}   // Oleada infinita: solo récord de tiempo
 else if(G.hc){if(G.score>recHC){recHC=G.score;store.set('rec_hardcore',recHC)}}
 else if(G.score>rec){rec=G.score;store.set('rec',rec)}
 if(G.maxCombo>bestCombo){bestCombo=G.maxCombo;store.set('bc',bestCombo)}
 if(G.hc&&G.score>1000)unlock('hc1000');
 if(G.hc&&G.runT>recHCTime){recHCTime=Math.floor(G.runT);store.set('rec_hc_time',recHCTime)}   // Bloque D
 if(G.mode==='normal'&&G.lvl>=10&&!unlockedEndless){unlockedEndless=true;store.set('endless',1);G.endlessUnlockedNow=true}   // Bloque C
 if(G.endless){go('over');return}   // sin tabla de récords: no hay nombre que guardar
 // Flujo: game over -> ingreso de nombre (si hay puntos) -> resultados -> menú
 nm.text=String(store.get('name','')).replace(/[^\p{L}\p{N} ]/gu,'').slice(0,NAME_MAX);   // recuerda el último nombre usado
 go(G.score>0?'name':'over')}

/* ===== ENTRADA DE NOMBRE Y GUARDADO DE RÉCORD (nuevo) ===== */
function saveEntry(skip){ // skip=true: omitir (Esc) y no guardar la puntuación
 if(!skip){const name=nm.text.trim()||'Anónimo';store.set('name',name);
  const e=addScore({name,score:G.score,mode:G.mode,level:G.lvl,combo:G.maxCombo,waves:G.waves,date:Date.now()});
  hl=e?{e,t:6}:null}                       // resalta la entrada nueva unos segundos (si entró al top 10)
 go('over')}
function nameKey(e){ // teclado del input de nombre: solo letras, números y espacios, máx. NAME_MAX
 if(sceneT<.3)return;                       // evita que una pulsación suelta al morir se cuele en el nombre
 if(e.code==='Enter'||e.code==='NumpadEnter'){e.preventDefault();if(!e.repeat)saveEntry(false)}
 else if(e.code==='Escape'){e.preventDefault();if(!e.repeat)saveEntry(true)}
 else if(e.code==='Backspace'){e.preventDefault();nm.text=nm.text.slice(0,-1)}
 else if(e.key.length===1&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&/^[\p{L}\p{N} ]$/u.test(e.key)){
  e.preventDefault();if(nm.text.length<NAME_MAX)nm.text+=e.key}}

/* ===== INPUT ===== */
function click(){
 if(scene!=='play')return;
 if(G.safeZone&&dist(mouse.x,mouse.y,G.safeZone.x,G.safeZone.y)<G.safeZone.r)return;   // Bloque G: en la zona segura no se recoge nada
 const bs=G.boss;
 if(bs&&!bs.entering&&dist(mouse.x,mouse.y,bs.x,bs.y)<bs.r+10){   // Bloque K: clic sobre el jefe lo daña
  bs.hp--;bs.phase=bs.hp<=3?(bs.hp<=1?3:2):1;
  burst(bs.x,bs.y,'#ff8a3d',20,200);sfx.hit();
  if(bs.hp<=0){
   for(let i=0;i<15;i++)G.orbs.push({x:clamp(bs.x+rnd(-60,60),30,W-30),y:clamp(bs.y+rnd(-60,60),90,H-30),age:0,life:ORB_LIFE,ph:rnd(0,6),golden:true});
   G.score+=500;G.boss=null;G.shake=8;sfx.boom();ft(W/2,200,'¡JEFE DERROTADO! +500','#ffd166',26);unlock('boss1')}
  return}
 let got=false,justPU=false;

function txt(s,x,y,sz,c,al='left',a=1){ctx.globalAlpha=a;ctx.fillStyle=c;ctx.font='600 '+sz+'px "Trebuchet MS",Segoe UI,sans-serif';ctx.textAlign=al;ctx.fillText(s,x,y);ctx.globalAlpha=1}
function poly(x,y,r,n,rot=0){ctx.beginPath();for(let i=0;i<n;i++){const a=rot+i*6.283/n;ctx[i?'lineTo':'moveTo'](x+Math.cos(a)*r,y+Math.sin(a)*r)}ctx.closePath()}

function puShape(k,x,y,r,c,t){ // formas distintivas de cada power-up

 if(k==='shield'){poly(x,y,r,6,t)}
 else if(k==='magnet'){for(let a=0;a<12;a+=.3){const rr=a*r/12;ctx[a?'lineTo':'moveTo'](x+Math.cos(a+t)*rr,y+Math.sin(a+t)*rr)}}
 else if(k==='slow'){ctx.arc(x,y,r,0,6.283);ctx.moveTo(x,y);ctx.lineTo(x,y-r*.7);ctx.moveTo(x,y);ctx.lineTo(x+r*.5,y)}
 else if(k==='freeze'){for(let i=0;i<3;i++){const a=i*Math.PI/3+t*.5;ctx.moveTo(x-Math.cos(a)*r,y-Math.sin(a)*r);ctx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r)}}
 else if(k==='combo'){poly(x,y,r,5,t)}   // pentágono rosa
 else{for(let i=0;i<16;i++){const a=i*Math.PI/8+t,rr=i%2?r*.5:r;ctx[i?'lineTo':'moveTo'](x+Math.cos(a)*rr,y+Math.sin(a)*rr)}ctx.closePath()}

const EGG_C=['#ffb3c8','#b3e5ff','#c8ffb3','#fff0b3','#e0b3ff'];   // paleta pastel
const darken=(h,f)=>{const n=parseInt(h.slice(1),16);return 'rgb('+[n>>16&255,n>>8&255,n&255].map(v=>Math.round(v*f)).join(',')+')'};
function drawEgg(c,pk){

 const rx=c.r*.85,ry=c.r*1.15,dk=darken(c.eggColor,.7);
 ctx.fillStyle=c.eggColor;glow(c.eggColor,12);ctx.beginPath();ctx.ellipse(c.x,c.y,rx,ry,0,0,6.283);ctx.fill();ctx.shadowBlur=0;

 for(let k=0;k<4;k++){const y0=c.y+(k-1.5)*ry*.5;ctx.beginPath();                    // 4 franjas en zigzag
  for(let j=0;j<=8;j++){const x=c.x-rx+j*rx/4,y=y0+(j%2?-1:1)*c.r*.14;ctx[j?'lineTo':'moveTo'](x,y)}ctx.stroke()}

 ctx.strokeStyle=pk==='freeze'?'#ffffff':darken(c.eggColor,.55);ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(c.x,c.y,rx,ry,0,0,6.283);ctx.stroke()}

function drawCircleShape(c,pk){
 const col=pk==='freeze'?'#cfe9ff':(c.color||'#ff3d5a'),x=c.x,y=c.y,r=c.r;

 if(c.type==='curve')poly(x,y,r,3,-Math.PI/2);                 // triángulo apuntando hacia arriba
 else if(c.type==='bounce')poly(x,y,r,4,0);                    // rombo (cuadrado a 45°)
 else if(c.type==='spiral'){ctx.beginPath();                   // espiral de 2 vueltas
  for(let a=0;a<=12.566;a+=.25){const q=a/12.566*r;ctx[a?'lineTo':'moveTo'](x+Math.cos(a+c.rot)*q,y+Math.sin(a+c.rot)*q)}}

  ctx.lineWidth=1.5;ctx.globalAlpha=.6;ctx.beginPath();
  for(let i=0;i<3;i++){const a=c.rot+i*2.094;ctx.moveTo(x,y);ctx.lineTo(x+Math.cos(a)*r*.8,y+Math.sin(a)*r*.8)}ctx.stroke();ctx.globalAlpha=1}
 else{ctx.globalAlpha=.25;ctx.lineWidth=1;ctx.beginPath();ctx.arc(x,y,r,0,6.283);ctx.stroke();   // aro tenue = zona de impacto
  ctx.globalAlpha=1;ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,2.5,0,6.283);ctx.fill()}}      // punto central

function drawCursor(sc,x=mouse.x,y=mouse.y,skin=selSkin){

// Rectángulo redondeado (no depende de ctx.roundRect para ser compatible con navegadores viejos)
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}

function drawBtn(it,on){

  pul=it.hot?.08*Math.sin(performance.now()/90):0,

 rr(it.x,it.y,it.w,it.h,10);ctx.fill();
 ctx.strokeStyle=c;ctx.globalAlpha=lk?.2:lit?1:.3;
 ctx.lineWidth=lk?1.2:lit?2.5:1.5;

 rr(it.x,it.y,it.w,it.h,10);ctx.stroke();
 ctx.shadowBlur=0;ctx.globalAlpha=1;
 const label=(lk?'🔒 ':'')+it.label;
